name: logoss
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python>=3.10
  # core Python deps
  - numpy>=1.21
  - pandas>=1.3
  - matplotlib>=3.5
  # bioinformatics
  - biopython>=1.79
  - logomaker>=0.8
  # external tools
  - dssp>=4.0,<5        # provides mkdssp (DSSP 4.x)
  # NOTE: ColabFold (colabfold_batch) must be installed separately
  # and available on PATH.
  # See https://github.com/sokrypton/ColabFold#installation
