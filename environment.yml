name: logoss
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.12
  # core Python deps
  - numpy>=1.21
  - pandas>=1.3
  - matplotlib>=3.5
  # bioinformatics
  - biopython>=1.79
  - logomaker>=0.8
  # external tools
  - dssp=4.5.*   # dssp 4.6.1 conda-forge builds fail with libmcfp 2.1.1 (undefined symbol), 2026-09
  # NOTE: ColabFold (colabfold_batch) must be installed separately
  # and available on PATH.
  # See https://github.com/sokrypton/ColabFold#installation
