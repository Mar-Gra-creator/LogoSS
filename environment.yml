name: logoss
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python>=3.9
  # core Python deps
  - numpy>=1.21
  - pandas>=1.3
  - matplotlib>=3.5
  # bioinformatics
  - biopython>=1.79
  - logomaker>=0.8
  # external tools
  - dssp>=3.0           # secondary-structure annotation
  - pip
  # NOTE: ColabFold (colabfold_batch) must be installed separately.
  # See https://github.com/sokrypton/ColabFold#installation
